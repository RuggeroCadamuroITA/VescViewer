name: Android verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run Android quality gate
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vescviewer-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
